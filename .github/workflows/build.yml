name: Build APK con Capacitor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inicializar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init "Palabras Rapidas" com.ricardo.palabrasrapidas --web-dir=www
          npm install @capacitor/android
          npx cap add android

      - name: Configurar Permisos de Microfono e Icono
        run: |
          # Inyectar permisos del micrófono en el AndroidManifest nativo
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST_PATH
          
          # Vincular icono si existe en la carpeta www
          if [ -f "www/icon.png" ]; then
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' capacitor.config.json || true
          fi

      - name: Compilar APK Final
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PalabrasRapidas.apk

      - name: Guardar APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: Palabras-Rapidas-APK
          path: PalabrasRapidas.apk
