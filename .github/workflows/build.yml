name: Build APK con Capacitor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Inicializar Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init "Palabras Rapidas" com.ricardo.palabrasrapidas --web-dir=www
          npm install @capacitor/android
          npx cap add android

      - name: Configurar Permisos de Microfono
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST_PATH
          fi

      - name: Compilar APK Final
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          find . -name "*.apk" -exec cp {} ../PalabrasRapidas.apk \;

      - name: Guardar APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: Palabras-Rapidas-APK
          path: PalabrasRapidas.apk
